        <path d="M0 1 C-9 -3 -12.5 -15 -8.5 -20.5 Q-5.8 -23.4 -3 -20.6 Q0 -24.6 3 -20.6 Q5.8 -23.4 8.5 -20.5 C12.5 -15 9 -3 0 1Z" transform="rotate(315)"/>

        <ellipse cy="-14" rx="3" ry="7" transform="rotate(144)"/>
        <ellipse cy="-14" rx="3" ry="7" transform="rotate(216)"/>
        <ellipse cy="-14" rx="3" ry="7" transform="rotate(288)"/>
      </g>
      <circle r="6.5" fill="#ffd36e"/>
      <circle r="3" fill="#f0a63a"/>

    <symbol id="daisy" viewBox="-25 -25 50 50">

    <symbol id="tulip" viewBox="-20 -24 40 48">

      <path d="M-18 16 L16 -16" stroke="rgba(0,0,0,.2)" stroke-width="1.5"/>

    <symbol id="star" viewBox="-28 -28 56 56">

      <use href="#peony" x="26" y="50" width="60" height="60" style="color:#f4c025"/>
      <use href="#peony" x="114" y="46" width="60" height="60" style="color:#f9dc6e"/>

  <!-- ========== Ambient layers ========== -->
  <div id="bg-hearts" aria-hidden="true"></div>
  <div id="fx-layer" aria-hidden="true"></div>
  <div id="bloom-layer" aria-hidden="true"></div>

  <audio id="bgm" loop preload="auto"></audio>
  <button id="music-btn" class="music-btn" aria-label="Toggle music" hidden>
    <span class="bars"><i></i><i></i><i></i><i></i></span>
  </button>

  <!-- ========== 1. INTRO: envelope ========== -->
  <section id="intro" class="scene active">
    <div class="inner intro-inner">
      <h1 class="script-title" id="intro-title">Happy Anniversary, Love !</h1>

      <div class="envelope" id="envelope" role="button" tabindex="0" aria-label="Open the envelope">
        <img class="env-peek" src="assets/gifs/heart-jump.gif" alt="" aria-hidden="true" />
        <div class="env-back"></div>
        <div class="env-letter">
          <span class="env-letter-text">For you<br />Kristine Kaye Pitallano Lim</span>
          <span class="env-letter-heart">♥</span>
        </div>
        <div class="env-pocket"></div>
        <div class="env-flap"></div>
        <div class="seal" id="seal">
          <svg viewBox="0 0 120 120">
            <path id="seal-blob" fill="url(#gold)" stroke="#b48d4a" stroke-width="1"/>
            <circle cx="60" cy="60" r="37" fill="url(#gold2)" stroke="rgba(150,110,50,.45)" stroke-width="2.5"/>
            <g fill="rgba(160,120,55,.6)" stroke="rgba(130,95,40,.6)" stroke-width=".8">
              <path d="M44 84 Q58 62 78 38" fill="none" stroke-width="2.2"/>
              <ellipse cx="50" cy="70" rx="4" ry="9" transform="rotate(-40 50 70)"/>
              <ellipse cx="60" cy="74" rx="4" ry="9" transform="rotate(50 60 74)"/>
              <ellipse cx="56" cy="60" rx="4" ry="9" transform="rotate(-35 56 60)"/>
              <ellipse cx="67" cy="62" rx="4" ry="9" transform="rotate(55 67 62)"/>
              <ellipse cx="63" cy="49" rx="3.6" ry="8" transform="rotate(-30 63 49)"/>
              <ellipse cx="74" cy="51" rx="3.6" ry="8" transform="rotate(60 74 51)"/>
              <ellipse cx="76" cy="38" rx="3" ry="7" transform="rotate(25 76 38)"/>
            </g>
          </svg>
        </div>
      </div>

      <p class="hint" id="intro-hint">tap the envelope for the surprise...</p>
    </div>
  </section>

  <!-- ========== 2. GIFTS menu ========== -->
  <section id="gifts" class="scene">
    <div class="inner gifts-inner">
      <h2 class="brush-title" data-pop>Gifts for you</h2>
      <div class="gift-grid">
        <button class="gift" data-go="message" data-pop style="--i:1">
          <span class="gift-icon">
            <svg viewBox="0 0 200 160">
              <g transform="rotate(-14 100 80)">
                <rect x="22" y="32" width="156" height="102" rx="9" fill="url(#envCream)" stroke="#c6b19c" stroke-width="2"/>
                <path d="M25 37 L100 92 L175 37" fill="none" stroke="#bda48d" stroke-width="2.5" stroke-linejoin="round"/>
                <path d="M26 130 L82 84 M174 130 L118 84" stroke="#d3c0ac" stroke-width="2"/>
                <path d="M40 50 q30 10 20 40 M150 110 q-20 -10 -10 -30" stroke="rgba(170,140,110,.25)" stroke-width="6" fill="none"/>
                <circle cx="100" cy="90" r="17" fill="#d99a17"/>
                <circle cx="100" cy="90" r="11.5" fill="#ecb22c" stroke="#a8700a" stroke-width="1.5"/>
                <path d="M95 89 q2 -6 6 -4 q4 3 0 7 q-4 3 -6 -1" fill="none" stroke="#8f5c06" stroke-width="1.6"/>
              </g>
            </svg>
          </span>
          <span class="gift-label">Message</span>
        </button>

        <button class="gift" data-go="memories" data-pop style="--i:2">
          <span class="gift-icon">
            <svg viewBox="0 0 200 210">
              <circle cx="58" cy="42" r="22" fill="#b5773f"/><circle cx="58" cy="42" r="12" fill="#e6b382"/>

                <circle cx="124" cy="181" r="3"/><circle cx="131" cy="178" r="3"/><circle cx="138" cy="181" r="3"/></g>
              <ellipse cx="100" cy="76" rx="54" ry="46" fill="#c58a55"/>
              <ellipse cx="100" cy="94" rx="21" ry="15" fill="#efc79c"/>
              <circle cx="80" cy="73" r="5" fill="#2b1a10"/><circle cx="120" cy="73" r="5" fill="#2b1a10"/>
              <circle cx="81.5" cy="71.5" r="1.6" fill="#fff"/><circle cx="121.5" cy="71.5" r="1.6" fill="#fff"/>
              <ellipse cx="100" cy="87" rx="6.5" ry="5" fill="#3a2214"/>
              <path d="M94 95 Q100 101 106 95" stroke="#3a2214" stroke-width="2.2" fill="none" stroke-linecap="round"/>
              <ellipse cx="70" cy="89" rx="9" ry="5.5" fill="#f2909f" opacity=".75"/>
              <ellipse cx="130" cy="89" rx="9" ry="5.5" fill="#f2909f" opacity=".75"/>
            </svg>
          </span>
          <span class="gift-label">Memories</span>
        </button>

        <button class="gift" data-go="flowers" data-pop style="--i:3">
          <span class="gift-icon"><svg viewBox="0 0 200 250"><use href="#peony-bouquet"/></svg></span>
          <span class="gift-label">Flowers</span>
        </button>
      </div>
      <p class="hint small" data-pop style="--i:4">choose a gift ♥</p>
    </div>
    <img class="walker" src="assets/gifs/drag.gif" alt="" aria-hidden="true" />
  </section>

  <!-- ========== 3. MESSAGE letter ========== -->
  <section id="message" class="scene">
    <div class="inner letter-wrap">
      <div class="letter-stage" data-pop>
        <div class="gingham"></div>
        <div class="paper">
          <div class="paper-text" id="letter-text"></div>
        </div>
        <svg class="deco star-a" viewBox="0 0 56 56"><use href="#star"/></svg>
        <svg class="deco star-b" viewBox="0 0 56 56"><use href="#star"/></svg>
        <svg class="deco star-c" viewBox="0 0 56 56"><use href="#star"/></svg>

        <!-- spring bouquet -->
        <svg class="deco spring-bouquet" viewBox="0 0 220 240">
          <g stroke="#5c9c4a" stroke-width="3.2" fill="none" stroke-linecap="round">
            <path d="M110 230 L110 180"/><path d="M110 185 Q80 130 50 100"/><path d="M110 185 Q95 120 92 60"/>
            <path d="M110 185 Q125 110 140 55"/><path d="M110 185 Q140 140 175 110"/><path d="M110 185 Q70 160 30 150"/>
            <path d="M110 185 Q160 170 195 160"/><path d="M110 185 Q112 120 118 90"/>
          </g>
          <g stroke="#9aa79a" stroke-width="2" fill="none"><path d="M110 185 Q60 80 40 30"/><path d="M110 185 Q150 90 185 40"/></g>
          <g fill="#e9e6df"><ellipse cx="46" cy="44" rx="4" ry="6"/><ellipse cx="54" cy="62" rx="4" ry="6"/><ellipse cx="180" cy="52" rx="4" ry="6"/><ellipse cx="170" cy="70" rx="4" ry="6"/></g>
          <use href="#leaf" x="60" y="140" width="36" height="36" style="color:#6aac55"/>
          <use href="#leaf" x="125" y="135" width="36" height="36" style="color:#58993f"/>
          <use href="#peony" x="22" y="74" width="54" height="54" style="color:#f7d24a"/>
          <use href="#peony" x="116" y="24" width="56" height="56" style="color:#fbe39a"/>
          <use href="#peony-bud" x="160" y="90" width="36" height="36" style="color:#f4c025"/>
          <use href="#daisy" x="68" y="35" width="52" height="52" style="color:#fffdf7"/>
          <use href="#peony" x="90" y="66" width="56" height="56" style="color:#f6c93a"/>
          <use href="#blossom" x="10" y="128" width="40" height="40" style="color:#f7d64e"/>
          <use href="#blossom" x="168" y="138" width="38" height="38" style="color:#fff4cf"/>
          <use href="#blossom" x="140" y="160" width="26" height="26" style="color:#f9b84a"/>
          <use href="#blossom" x="58" y="168" width="26" height="26" style="color:#fde9a8"/>
          <path d="M95 190 Q110 182 125 190 L122 212 Q110 206 98 212Z" fill="#e6c27a"/>
          <path d="M98 198 Q110 204 122 198" stroke="#b58a3c" stroke-width="2" fill="none"/>
        </svg>

        <button class="vinyl" data-go="song" aria-label="Open your song">
          <span class="vinyl-disc"><span class="vinyl-label"></span></span>
          <span class="vinyl-text">Click Here</span>
        </button>
      </div>
      <button class="back-btn" data-go="gifts" data-pop style="--i:2">← back to gifts</button>
    </div>
  </section>

  <!-- ========== 4. SONG ========== -->
  <section id="song" class="scene">
    <div class="inner song-wrap">
      <h2 class="brush-title" data-pop>Song for you</h2>
      <div class="song-stage" data-pop style="--i:1">
        <svg class="deco s-star1" viewBox="0 0 56 56"><use href="#star"/></svg>
        <svg class="deco s-star2" viewBox="0 0 56 56"><use href="#star"/></svg>
        <div class="video-frame" id="video-frame"></div>
        <svg class="deco s-flowers" viewBox="0 0 160 120">
          <use href="#leaf" x="70" y="56" width="40" height="40" style="color:#5a9c45"/>
          <use href="#peony" x="0" y="20" width="80" height="80" style="color:#fff1c4"/>
          <use href="#peony" x="58" y="44" width="66" height="66" style="color:#f7d24a"/>
        </svg>
        <div class="stamps">
          <svg class="deco s-bow" viewBox="0 0 120 90">
            <path d="M60 40 Q20 0 8 22 Q0 45 60 44Z" fill="url(#ging)" stroke="#b07a08" stroke-width="2"/>
            <path d="M60 40 Q100 0 112 22 Q120 45 60 44Z" fill="url(#ging)" stroke="#b07a08" stroke-width="2"/>
            <path d="M56 44 Q40 70 30 88 L44 84 L58 46Z" fill="url(#ging)" stroke="#b07a08" stroke-width="2"/>
            <path d="M64 44 Q80 70 90 88 L76 84 L62 46Z" fill="url(#ging)" stroke="#b07a08" stroke-width="2"/>
            <rect x="52" y="34" width="16" height="16" rx="5" fill="url(#ging)" stroke="#b07a08" stroke-width="2"/>
          </svg>
          <figure class="stamp st1"><img alt="Us" data-photo="song0"/></figure>
          <figure class="stamp st2"><img alt="Us" data-photo="song1"/></figure>
        </div>
      </div>
      <button class="back-btn" data-go="message" data-pop style="--i:2">← back to the letter</button>
    </div>
  </section>

  <!-- ========== 5. MEMORIES ========== -->
  <section id="memories" class="scene">
    <div class="inner mem-wrap">
      <img class="mem-gif" src="assets/gifs/love.gif" alt="" aria-hidden="true" data-pop />
      <h2 class="brush-title" data-pop>Our Memories</h2>
      <p class="hint small" data-pop style="--i:1">every moment with you is my favorite</p>
      <div class="polaroids" id="polaroids"></div>
      <button class="back-btn" data-go="gifts" data-pop style="--i:3">← back to gifts</button>
    </div>
  </section>

  <!-- ========== 6. FLOWERS ========== -->
  <section id="flowers" class="scene">
    <div class="inner flowers-inner">
      <h2 class="brush-title" data-pop>Peonies for you</h2>
      <button class="big-bouquet" id="big-bouquet" data-pop style="--i:1" aria-label="Tap the bouquet">
        <svg viewBox="0 0 200 250"><use href="#peony-bouquet"/></svg>
      </button>
      <p class="hint" data-pop style="--i:2" id="flower-hint">tap the bouquet ✿</p>
      <button class="back-btn" data-go="gifts" data-pop style="--i:3">← back to gifts</button>
    </div>

    <div class="reveal" id="reveal" hidden>
      <figure class="reveal-frame">
        <img class="reveal-photo" alt="Us" data-photo="reveal" />
      </figure>
      <div class="reveal-text">
        <h2 class="reveal-big" id="reveal-big">I LOVE YOU VERY MUCH BUBU!!!</h2>
      </div>
      <div class="reveal-actions">
        <button class="pill" id="again-btn">✿ again</button>
        <button class="pill" data-go="gifts">back to gifts</button>
      </div>
    </div>
  </section>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox" hidden>
    <figure class="lightbox-card">
      <img id="lightbox-img" alt="" />
      <figcaption id="lightbox-cap"></figcaption>
    </figure>
  </div>

  <script src="script.js"></script>
</body>
</html>
